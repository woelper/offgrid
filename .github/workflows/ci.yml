name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: 'CUDA toolkit version for the cuda job'
        default: '12.9.1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      # Debug profile: the release profile uses panic=abort, which the libtest
      # harness cannot run. The snapshot test is skipped — its baseline is
      # rendered on the dev machine's GPU and differs on CI rasterizers.
      - name: tests
        run: cargo test -- --skip main_screen_snapshot

  # The GPU build compiles a whole second ggml backend and its shaders, which
  # takes many minutes — too much for every push, where the ordinary build
  # above is the check that matters. Run it from the Actions tab when the
  # Vulkan path or the llama.cpp dependency changes; a release tag builds it
  # for real anyway, and that job does not fail-fast.
  #
  # It builds rather than checks: linking against the Vulkan loader is its own
  # failure mode, and the compile of llama.cpp dominates either way. The
  # runners have no GPU, so nothing here exercises the offload at runtime —
  # that is what the layer-counting unit tests are for.
  vulkan:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: ./.github/actions/setup-vulkan

      - name: build
        run: cargo build --features vulkan

  # Same deal as `vulkan`, with an even slower compile: the toolkit install
  # plus the multi-arch nvcc build are the longest steps in any workflow here.
  # Manual only, run from the Actions tab when the CUDA path changes; a
  # release tag builds it for real anyway.
  #
  # It builds rather than checks, for the same reason (linking against cudart
  # and cublas is its own failure mode). The runners have no GPU, so nothing
  # here exercises the offload at runtime — that is what the layer-counting
  # unit tests and a physical NVIDIA box are for.
  cuda:
    if: github.event_name == 'workflow_dispatch'
    # Capped, but generously: the Windows CUDA backend takes well over two
    # hours with NUM_JOBS=2, and a wedged toolkit installer must still fail
    # the job instead of sitting on it.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # windows-2022 for the same reason as the release matrix below: VS 2026
      # on windows-latest crashes cudafe++.
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: ./.github/actions/setup-cuda
        with:
          # The cuda job only runs on workflow_dispatch, so inputs always
          # exist here — this is the knob for A/B-ing toolkit versions.
          cuda: ${{ inputs.cuda }}

      - name: build
        # The cmake crate reads NUM_JOBS for build parallelism: unbounded
        # parallel nvcc OOM-kills the 16 GB runners on the fat multi-arch
        # compile, so two at a time — slow, but it survives.
        env:
          NUM_JOBS: 2
        run: cargo build --features cuda
