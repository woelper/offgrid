name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: 'CUDA toolkit version for the cuda job'
        default: '12.9.1'
      gpu:
        description: 'Also build the Vulkan and CUDA jobs (hours, not minutes)'
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      # Debug profile: the release profile uses panic=abort, which the libtest
      # harness cannot run. The snapshot test is skipped — its baseline is
      # rendered on the dev machine's GPU and differs on CI rasterizers.
      - name: tests
        run: cargo test -- --skip main_screen_snapshot

  # Image generation is optional for anyone building offgrid — it wants cmake, a
  # C++ toolchain and a ggml built outside cargo — but CI builds it on every
  # push, because a feature nobody compiles is a feature that quietly rots.
  # Linux only for now: the build script is bash and has only ever been run
  # there.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      # ggml and stable-diffusion.cpp are a ten-minute compile that changes
      # only when the pinned revision or the lockfile does.
      - name: Cache the ggml and stable-diffusion.cpp build
        uses: actions/cache@v4
        with:
          path: .sd-cpp
          key: sd-cpp-${{ runner.os }}-${{ hashFiles('scripts/images-build.sh', 'Cargo.lock') }}

      - name: build
        run: ./scripts/images-build.sh build --features images

      - name: clippy
        run: ./scripts/images-build.sh clippy --features images --all-targets -- -D warnings

  # macOS and Windows for the same feature, on demand rather than per push:
  # each is another ten-minute C++ build, and the Linux job above catches
  # anything that is not platform-specific. Run this before tagging a release,
  # since the release matrix builds all three.
  images-cross:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache the ggml and stable-diffusion.cpp build
        uses: actions/cache@v4
        with:
          path: .sd-cpp
          key: sd-cpp-${{ runner.os }}-${{ hashFiles('scripts/images-build.sh', 'Cargo.lock') }}

      # bash on Windows too: the script is bash, and the runners have git-bash.
      - name: build
        shell: bash
        run: ./scripts/images-build.sh build --release --features images

  # The GPU build compiles a whole second ggml backend and its shaders, which
  # takes many minutes — too much for every push, where the ordinary build
  # above is the check that matters. Run it from the Actions tab when the
  # Vulkan path or the llama.cpp dependency changes; a release tag builds it
  # for real anyway, and that job does not fail-fast.
  #
  # It builds rather than checks: linking against the Vulkan loader is its own
  # failure mode, and the compile of llama.cpp dominates either way. The
  # runners have no GPU, so nothing here exercises the offload at runtime —
  # that is what the layer-counting unit tests are for.
  vulkan:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: ./.github/actions/setup-vulkan

      - name: build
        run: cargo build --features vulkan

  # Same deal as `vulkan`, with an even slower compile: the toolkit install
  # plus the multi-arch nvcc build are the longest steps in any workflow here.
  # Manual only, run from the Actions tab when the CUDA path changes; a
  # release tag builds it for real anyway.
  #
  # It builds rather than checks, for the same reason (linking against cudart
  # and cublas is its own failure mode). The runners have no GPU, so nothing
  # here exercises the offload at runtime — that is what the layer-counting
  # unit tests and a physical NVIDIA box are for.
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    # Capped, but generously: a cold Windows CUDA build ran well over two
    # hours before the architecture list was trimmed, and a wedged toolkit
    # installer must still fail the job instead of sitting on it.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # windows-2022 for the same reason as the release matrix below: VS 2026
      # on windows-latest crashes cudafe++.
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: ./.github/actions/setup-cuda
        with:
          # The cuda job only runs on workflow_dispatch, so inputs always
          # exist here — this is the knob for A/B-ing toolkit versions.
          cuda: ${{ inputs.cuda }}

      - name: build
        # The cmake crate reads NUM_JOBS for build parallelism. This was two,
        # because unbounded parallel nvcc OOM-killed the 16 GB runners on the
        # fat ten-architecture compile; four targets need far less memory per
        # process, so the runner's own core count is back on the table. Dial
        # this down again if a build dies with signal 9.
        env:
          NUM_JOBS: 4
        run: |
          cargo build --features cuda
          command -v ccache >/dev/null && ccache --show-stats --verbose || true
