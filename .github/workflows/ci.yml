name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      # Debug profile: the release profile uses panic=abort, which the libtest
      # harness cannot run. The snapshot test is skipped — its baseline is
      # rendered on the dev machine's GPU and differs on CI rasterizers.
      - name: tests
        run: cargo test -- --skip main_screen_snapshot

  # The GPU build compiles a whole second ggml backend and its shaders, none
  # of which the default build touches. Without this job a broken
  # `--features vulkan` would first surface when a release tag is already
  # pushed and the Windows GPU artifact fails to build.
  #
  # It builds rather than checks: linking against the Vulkan loader is its own
  # failure mode, and the compile of llama.cpp dominates either way. The
  # runners have no GPU, so nothing here exercises the offload at runtime —
  # that is what the layer-counting unit tests are for.
  vulkan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: ./.github/actions/setup-vulkan

      - name: build
        run: cargo build --features vulkan
