name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
          # A second Windows artifact with GPU offload compiled in. Separate
          # rather than default because it only runs where a Vulkan driver is
          # installed, and the plain build has to keep working everywhere.
          - os: windows-latest
            target: windows-x86_64-vulkan
            features: vulkan
          # CUDA artifacts: NVIDIA only, and the fastest backend on their
          # cards. Two of them because the link differs per OS — static on
          # Linux (the binary is self-contained), dynamic on Windows (the
          # runtime DLLs travel in the zip). Both need the NVIDIA driver at
          # runtime; without a usable GPU they stay on the CPU.
          - os: ubuntu-latest
            target: linux-x86_64-cuda
            features: cuda
          # windows-2022, not -latest: the Server 2025 / VS 2026 image ships
          # an MSVC whose headers crash cudafe++ (ACCESS_VIOLATION on a
          # trivial kernel, all toolsets), while VS 2022 17.x is the toolchain
          # CUDA 12.x was built for. Revisit if GitHub retires the image.
          - os: windows-2022
            target: windows-x86_64-cuda
            features: cuda
          # Image generation, on all three. The shared ggml carries Metal on
          # macOS, so the same binary keeps GPU acceleration for chat; the
          # other two are CPU, as their plain artifacts are. All three are
          # tarballs — the build goes through a script rather than
          # cargo-bundle, so there is no .deb or .app.
          - os: ubuntu-latest
            target: linux-x86_64-images
            features: images
          - os: macos-latest
            target: macos-arm64-images
            features: images
          - os: windows-latest
            target: windows-x86_64-images
            features: images
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      # cargo-bundle produces the .deb (Linux) and .app (macOS). Its Windows
      # (msi) support is still experimental, so Windows ships a plain zip.
      - name: Install cargo-bundle
        # Not for the image builds: they ship a tarball and would otherwise
        # spend two minutes compiling a tool they never call.
        if: runner.os != 'Windows' && matrix.features != 'images'
        run: cargo install cargo-bundle

      # GPU toolkits live up here, before every build step: the Linux CUDA
      # job needs nvcc just like the Windows one does. The `if` gates keep
      # the plain builds exactly as they were.
      # ggml compiles its Vulkan shaders with glslc at build time, so the SDK
      # has to be there before cargo runs — the runtime loader is not enough.
      #
      # The images builds want it too, on the platforms that have no backend
      # of their own: one ggml serves both sd.cpp and llama.cpp, so a CPU-only
      # ggml would ship an images binary that is CPU-only for chat as well.
      # macOS is excluded because the script gives it Metal instead.
      - uses: ./.github/actions/setup-vulkan
        if: >-
          matrix.features == 'vulkan' ||
          (matrix.features == 'images' && runner.os != 'macOS')

      # nvcc compiles ggml's CUDA kernels at build time, so the toolkit has
      # to be there before cargo runs — the driver alone is not enough.
      - uses: ./.github/actions/setup-cuda
        if: matrix.features == 'cuda'

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "cuda" ]; then
            # Was 2, when ten architectures were compiled and parallel nvcc
            # OOM-killed the runner; four architectures leave room for the
            # runner's own core count. See .github/actions/setup-cuda.
            export NUM_JOBS=4
          fi
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          if [ "${{ matrix.features }}" = "images" ]; then
            # ggml and stable-diffusion.cpp are built outside cargo and shared
            # with llama.cpp, so the script drives the build. Tarball only, and
            # no .deb: this is exactly the command CI runs on every push, where
            # cargo-bundle is not involved, and a release is a poor place to
            # find out that it is.
            #
            # `vulkan`, not `auto`: a missing SDK should fail the release
            # rather than quietly ship the CPU-only binary it would otherwise
            # build, which nothing downstream would notice.
            OFFGRID_IMAGES_GPU=vulkan ./scripts/images-build.sh build --release --features images
          else
            if [ -n "${{ matrix.features }}" ]; then
              cargo bundle --release --format deb --features "${{ matrix.features }}"
            else
              cargo bundle --release --format deb
            fi
            cp target/release/bundle/deb/*.deb "dist/offgrid-${VERSION}-${{ matrix.target }}.deb"
          fi
          tar -C target/release -czf "dist/offgrid-${VERSION}-${{ matrix.target }}.tar.gz" offgrid

      - name: Build (macOS, image generation)
        if: runner.os == 'macOS' && matrix.features == 'images'
        shell: bash
        run: |
          # The script builds the shared ggml — with Metal, so this binary
          # keeps GPU acceleration for both images and chat — then
          # stable-diffusion.cpp against it, then calls cargo. A plain tarball rather than a signed .app,
          # because none of that goes through cargo-bundle.
          ./scripts/images-build.sh build --release --features images
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          tar -C target/release -czf "dist/offgrid-${VERSION}-${{ matrix.target }}.tar.gz" offgrid

      - name: Build (macOS)
        if: runner.os == 'macOS' && matrix.features != 'images'
        shell: bash
        run: |
          cargo bundle --release
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          # Ad-hoc signature: without any signature, Apple Silicon macOS
          # refuses to launch the app and reports it as "damaged".
          codesign --force --deep --sign - target/release/bundle/osx/offgrid.app
          # ditto is Apple's archiver; it preserves bundle metadata that zip drops.
          ditto -c -k --keepParent target/release/bundle/osx/offgrid.app \
            "dist/offgrid-${VERSION}-${{ matrix.target }}.app.zip"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "cuda" ]; then
            # Was 2, when ten architectures were compiled and parallel nvcc
            # OOM-killed the runner; four architectures leave room for the
            # runner's own core count. See .github/actions/setup-cuda.
            export NUM_JOBS=4
          fi
          if [ "${{ matrix.features }}" = "images" ]; then
            # ggml and stable-diffusion.cpp are built outside cargo and shared
            # with llama.cpp; the script does that and then calls cargo.
            # Vulkan for the same reason as the Linux job: a silent fallback
            # to CPU is the one outcome nobody would catch.
            OFFGRID_IMAGES_GPU=vulkan ./scripts/images-build.sh build --release --features images
          elif [ -n "${{ matrix.features }}" ]; then
            cargo build --release --features "${{ matrix.features }}"
          else
            cargo build --release
          fi
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          FILES="./target/release/offgrid.exe"
          if [ "${{ matrix.features }}" = "cuda" ]; then
            # The Windows CUDA link is dynamic (NVIDIA ships no static cublas
            # there), so the runtime DLLs travel in the zip next to the exe.
            CUDA_BIN="$(cygpath -u "$CUDA_PATH/bin")"
            cp "$CUDA_BIN"/cudart64_*.dll "$CUDA_BIN"/cublas64_*.dll \
              "$CUDA_BIN"/cublasLt64_*.dll ./target/release/
            FILES="$FILES ./target/release/cudart64_*.dll ./target/release/cublas64_*.dll ./target/release/cublasLt64_*.dll"
          fi
          # shellcheck disable=SC2086: FILES is a file list, splitting intended
          7z a "dist/offgrid-${VERSION}-${{ matrix.target }}.zip" $FILES

      # gh, not a third-party action: softprops/action-gh-release targets Node
      # 20, the runners now force Node 24 on it, and its uploads started
      # failing with "Error creating asset temp dir" — two of four artifacts
      # in v0.4.2. gh ships on every runner and has no Node of its own.
      #
      # The four build jobs race to create the release; whoever loses finds it
      # already there, which is why create is allowed to fail. --clobber makes
      # a re-run of one job replace its own asset instead of erroring.
      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
