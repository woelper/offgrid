name: Set up CUDA
description: >
  Set a runner up to compile ggml's CUDA backend: the CUDA toolkit (nvcc plus
  the cublas/cudart dev libraries). The runners have no GPU — this is for
  building, not running.

inputs:
  cuda:
    description: >
      CUDA toolkit version to install. Pinned, not floating: a new major drops
      older architectures and repackages the installer, so bumps are
      deliberate. The version must exist in Jimver/cuda-toolkit's links for
      both Linux and Windows.
    default: '12.9.1'

runs:
  using: composite
  steps:
    # Deliberately no vcvars/msvc-dev-cmd here: rustc, cc and CMake all find
    # MSVC on their own (as the plain and Vulkan Windows jobs prove), while a
    # wholesale PATH rewrite made rustc resolve Git's `link.exe` instead of
    # MSVC's and fail every link. nvcc locates its host compiler the same
    # independent way; if it ever cannot, scope that fix to nvcc
    # (CUDAHOSTCXX) instead of rewriting PATH.
    - name: CUDA toolkit (Linux)
      if: runner.os == 'Linux'
      # Pinned at patch level, not master: the 0.2.25–0.2.28 range broke
      # installs on Windows runners, and only the tag tells us what we got.
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # The full local installer drags in drivers and samples the build
        # never touches; --toolkit keeps nvcc and the libraries.
        linux-local-args: '["--toolkit"]'
        # Required: without it every matrix job uploads its install log under
        # the same name.
        log-file-suffix: 'linux-cuda.txt'

    - name: CUDA toolkit (Windows)
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # The full local installer stalls for 25+ minutes on these runners;
        # the network installer with just nvcc, the runtime/math libraries and
        # the VS integration stays under ~10. cublas_dev carries the cublasLt
        # headers the Windows link needs; extend this list if a header or import
        # library ever goes missing, rather than switching back to local.
        method: network
        sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
        log-file-suffix: 'windows-cuda.txt'

    - name: nvcc check
      shell: bash
      run: nvcc --version
