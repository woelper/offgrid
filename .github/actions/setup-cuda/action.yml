name: Set up CUDA
description: >
  Set a runner up to compile ggml's CUDA backend: the CUDA toolkit (nvcc plus
  the cublas/cudart dev libraries). The runners have no GPU — this is for
  building, not running.

inputs:
  cuda:
    description: >
      CUDA toolkit version to install. Pinned, not floating: a new major drops
      older architectures and repackages the installer, so bumps are
      deliberate. The version must exist in Jimver/cuda-toolkit's links for
      both Linux and Windows.
    default: '12.9.1'

runs:
  using: composite
  steps:
    # Deliberately no vcvars-style PATH rewrite here: rustc, cc and CMake all
    # find MSVC on their own (as the plain and Vulkan Windows jobs prove),
    # while a wholesale PATH rewrite once made rustc resolve Git's `link.exe`
    # instead of MSVC's and fail every link. nvcc is the exception — nothing
    # on PATH provides cl.exe — so the step below imports *only*
    # INCLUDE/LIB/LIBPATH from vcvars and hands nvcc its host compiler by
    # absolute path. Both are scoped to nvcc/CMake; PATH stays as it was.
    - name: CUDA toolkit (Linux)
      if: runner.os == 'Linux'
      # Pinned at patch level, not master: the 0.2.25–0.2.28 range broke
      # installs on Windows runners, and only the tag tells us what we got.
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # The full local installer drags in drivers and samples the build
        # never touches; --toolkit keeps nvcc and the libraries.
        linux-local-args: '["--toolkit"]'
        # Required: without it every matrix job uploads its install log under
        # the same name.
        log-file-suffix: 'linux-cuda.txt'

    - name: CUDA toolkit (Windows)
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # Full component set over the network installer. A minimal
        # sub-package list was tried first — cudafe++ access-violated on a
        # trivial kernel with every host compiler, which smells like a
        # silently incomplete install, so completeness wins over download
        # size here. (The full *local* installer is the fallback if this
        # ever hangs; it is known to stall 25+ minutes on these runners.)
        method: network
        log-file-suffix: 'windows-cuda.txt'

    # What exactly got installed? A cudafe++ that reports a different version
    # than nvcc (or a bin dir missing the usual companions) means a mixed or
    # partial install — the classic cause of cudafe++ access violations.
    - name: CUDA install diagnostics (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        nvcc --version
        & "$env:CUDA_PATH\bin\cudafe++.exe" --version
        Get-ChildItem "$env:CUDA_PATH\bin" -File |
          Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  bin: $_" }

    # nvcc needs cl.exe plus the MSVC/Windows-SDK INCLUDE/LIB — none of which
    # a stock runner PATH provides. So: enumerate every MSVC toolset on every
    # VS instance, source that toolset's *own* vcvars env (`-vcvars_ver`, not
    # the instance default — a newer cl against older headers crashes cudafe++
    # just as surely as the reverse), and probe-compile with it. Newest
    # working toolset wins. (CUDA 12.9's cudafe++ access-violates on the
    # VS18-era MSVC 14.51 headers, so where an image also carries older
    # toolsets one of those is what actually works.) The probe fails the job
    # fast with nvcc's raw error instead of after a 30-minute cargo build,
    # where CMake would only report "No CUDA toolset found".
    #
    # Deliberately no vcvars-style PATH rewrite and no msvc-dev-cmd: rustc, cc
    # and CMake all find MSVC on their own (as the plain and Vulkan Windows
    # jobs prove), while a wholesale PATH rewrite once made rustc resolve
    # Git's `link.exe` instead of MSVC's and fail every link.
    - name: CUDA host compiler (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $instances = @(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath)
        if (-not $instances -or -not $instances[0]) { throw "vswhere found no VS with C++ tools" }
        $candidates = foreach ($vs in $instances) {
          foreach ($cl in (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction SilentlyContinue)) {
            [pscustomobject]@{
              Vs = $vs
              Cl = $cl.FullName
              Ver = ($cl.Directory.Parent.Parent.Parent.FullName | Split-Path -Leaf)
            }
          }
        }
        if (-not $candidates) { throw "no MSVC cl.exe found in any VS instance" }
        Write-Host "Windows SDKs on this image:"
        Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  SDK $_" }
        Set-Content -Path "$env:RUNNER_TEMP\probe_min.cu" -Value '__global__ void k() {}
        int main(){return 0;}'
        Set-Content -Path "$env:RUNNER_TEMP\probe.cu" -Value '#include <cuda_runtime.h>
        __global__ void k() {}
        int main(){return 0;}'
        # Full matrix per candidate, cheapest first: a bare kernel separates a
        # broken cudafe++ from one choking on headers, and strict separates an
        # allowlist rejection (clean, expected on new toolsets) from a real
        # crash. The first candidate with a FULL pass wins, preferring strict
        # so the real build only carries the bypass flag when it proved
        # necessary.
        $winner = $null
        $winnerFree = $false
        foreach ($c in ($candidates | Sort-Object { [version]$_.Ver } -Descending)) {
          $toolset = ($c.Ver -split '\.')[0..1] -join '.'
          Write-Host "probing host compiler $($c.Cl) (vcvars_ver=$toolset)"
          Write-Host "  compiler banner: $((& $c.Cl 2>&1 | Select-Object -First 1))"
          foreach ($v in 'INCLUDE', 'LIB', 'LIBPATH') {
            [Environment]::SetEnvironmentVariable($v, $null, 'Process')
          }
          cmd /c "`"$($c.Vs)\VC\Auxiliary\Build\vcvars64.bat`" -vcvars_ver=$toolset >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $include = [Environment]::GetEnvironmentVariable('INCLUDE', 'Process')
          Write-Host "  INCLUDE head: $($include.Substring(0, [Math]::Min(160, $include.Length)))"
          $nvcc = "$env:CUDA_PATH\bin\nvcc.exe"
          Write-Host '  [min/strict]'
          & $nvcc -ccbin $c.Cl -c "$env:RUNNER_TEMP\probe_min.cu" -o "$env:RUNNER_TEMP\probe_min.obj" 2>&1 |
            ForEach-Object { Write-Host "    $_" }
          $minStrict = $LASTEXITCODE -eq 0
          $fullStrict = $false
          if ($minStrict) {
            Write-Host '  [full/strict]'
            & $nvcc -ccbin $c.Cl -c "$env:RUNNER_TEMP\probe.cu" -o "$env:RUNNER_TEMP\probe.obj" 2>&1 |
              ForEach-Object { Write-Host "    $_" }
            $fullStrict = $LASTEXITCODE -eq 0
          }
          if ($fullStrict) { $winner = $c; break }
          Write-Host '  [min/free]'
          & $nvcc -ccbin $c.Cl -allow-unsupported-compiler -c "$env:RUNNER_TEMP\probe_min.cu" -o "$env:RUNNER_TEMP\probe_min.obj" 2>&1 |
            ForEach-Object { Write-Host "    $_" }
          $fullFree = $false
          if ($LASTEXITCODE -eq 0) {
            Write-Host '  [full/free]'
            & $nvcc -ccbin $c.Cl -allow-unsupported-compiler -c "$env:RUNNER_TEMP\probe.cu" -o "$env:RUNNER_TEMP\probe.obj" 2>&1 |
              ForEach-Object { Write-Host "    $_" }
            $fullFree = $LASTEXITCODE -eq 0
          }
          if ($fullFree) { $winner = $c; $winnerFree = $true; break }
        }
        if (-not $winner) { throw "no working nvcc host compiler found" }
        Write-Host "using host compiler $($winner.Cl) (bypass flag needed: $winnerFree)"
        Add-Content $env:GITHUB_ENV "CMAKE_CUDA_HOST_COMPILER=$($winner.Cl)"
        foreach ($v in 'INCLUDE', 'LIB', 'LIBPATH') {
          Add-Content $env:GITHUB_ENV "$v=$([Environment]::GetEnvironmentVariable($v, 'Process'))"
        }
        if ($winnerFree) {
          # Only when a strict probe proved necessary: newer MSVC than the
          # toolkit's host_config.h allowlist knows.
          Add-Content $env:GITHUB_ENV "CMAKE_CUDA_FLAGS=-allow-unsupported-compiler"
        }

    - name: nvcc check
      shell: bash
      run: nvcc --version
