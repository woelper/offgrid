name: Set up CUDA
description: >
  Set a runner up to compile ggml's CUDA backend: the CUDA toolkit (nvcc plus
  the cublas/cudart dev libraries). The runners have no GPU — this is for
  building, not running.

inputs:
  cuda:
    description: >
      CUDA toolkit version to install. Pinned, not floating: a new major drops
      older architectures and repackages the installer, so bumps are
      deliberate. The version must exist in Jimver/cuda-toolkit's links for
      both Linux and Windows.
    default: '12.9.1'

runs:
  using: composite
  steps:
    # Deliberately no vcvars-style PATH rewrite here: rustc, cc and CMake all
    # find MSVC on their own (as the plain and Vulkan Windows jobs prove),
    # while a wholesale PATH rewrite once made rustc resolve Git's `link.exe`
    # instead of MSVC's and fail every link. nvcc is the exception — nothing
    # on PATH provides cl.exe — so the step below imports *only*
    # INCLUDE/LIB/LIBPATH from vcvars and hands nvcc its host compiler by
    # absolute path. Both are scoped to nvcc/CMake; PATH stays as it was.
    - name: CUDA toolkit (Linux)
      if: runner.os == 'Linux'
      # Pinned at patch level, not master: the 0.2.25–0.2.28 range broke
      # installs on Windows runners, and only the tag tells us what we got.
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # The full local installer drags in drivers and samples the build
        # never touches; --toolkit keeps nvcc and the libraries.
        linux-local-args: '["--toolkit"]'
        # Required: without it every matrix job uploads its install log under
        # the same name.
        log-file-suffix: 'linux-cuda.txt'

    - name: CUDA toolkit (Windows)
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: ${{ inputs.cuda }}
        # The full local installer stalls for 25+ minutes on these runners;
        # the network installer with just nvcc, the runtime/math libraries and
        # the VS integration stays under ~10. cublas_dev carries the cublasLt
        # headers the Windows link needs; extend this list if a header or import
        # library ever goes missing, rather than switching back to local.
        method: network
        sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
        log-file-suffix: 'windows-cuda.txt'

    # nvcc's `-ccbin` plus the MSVC/Windows-SDK INCLUDE/LIB it needs: CMake's
    # CUDA compiler check dies with "No CUDA toolset found" when nvcc cannot
    # see a host compiler, and nothing on a stock runner PATH provides cl.exe.
    # llama-cpp-sys-2's build script forwards every CMAKE_ variable to its
    # CMake configure, so exports here land as -D flags there.
    - name: CUDA host compiler and MSVC env (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        $cl = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" |
          Sort-Object { [version]($_.Directory.Parent.Parent.Parent.FullName | Split-Path -Leaf) } |
          Select-Object -Last 1 -ExpandProperty FullName
        if (-not $cl) { throw "no MSVC cl.exe found under $vs" }
        Add-Content $env:GITHUB_ENV "CMAKE_CUDA_HOST_COMPILER=$cl"
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^(INCLUDE|LIB|LIBPATH)=(.*)$') {
            Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])"
          }
        }
        if (-not (Select-String -Path $env:GITHUB_ENV -Pattern '^INCLUDE=' -Quiet)) {
          throw "vcvars import produced no INCLUDE"
        }
        # CUDA 12.9 predates the VS18-era MSVC on these runners, whose version
        # nvcc's host_config.h allowlist rejects — opt out of that check.
        Add-Content $env:GITHUB_ENV "CMAKE_CUDA_FLAGS=-allow-unsupported-compiler"

    # Fail fast with nvcc's raw error instead of after a 30-minute cargo
    # build: CMake's "No CUDA toolset found" swallows the real message.
    - name: nvcc probe compile (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Content -Path "$env:RUNNER_TEMP\probe.cu" -Value '#include <cuda_runtime.h>
        __global__ void k() {}
        int main(){return 0;}'
        & "$env:CUDA_PATH\bin\nvcc.exe" -ccbin "$env:CMAKE_CUDA_HOST_COMPILER" `
          -allow-unsupported-compiler -c "$env:RUNNER_TEMP\probe.cu" `
          -o "$env:RUNNER_TEMP\probe.obj"

    - name: nvcc check
      shell: bash
      run: nvcc --version
