name: Set up Vulkan
description: >
  Install what ggml needs to compile its Vulkan backend: the headers and
  loader, plus glslc, which compiles the backend's shaders during the build.
  The runners have no GPU — this is for building, not running.

inputs:
  version:
    description: >
      LunarG SDK version to install (Windows only), or "latest" to ask LunarG
      which one that is. Pinning is a trap here: LunarG prunes older SDKs from
      its download server, so a version pinned today 404s a few months from
      now.
    default: latest

runs:
  using: composite
  steps:
    - name: Vulkan headers and glslc (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # spirv-headers is not optional: ggml-vulkan's CMakeLists does
        # `find_package(SPIRV-Headers CONFIG REQUIRED)`, and the package is
        # what ships SPIRV-HeadersConfig.cmake. The Windows SDK bundles it.
        sudo apt-get install -y libvulkan-dev glslc spirv-headers
        glslc --version

    - name: Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VULKAN_VERSION: ${{ inputs.version }}
      run: |
        $version = $env:VULKAN_VERSION
        if (-not $version -or $version -eq 'latest') {
          $version = (Invoke-RestMethod https://vulkan.lunarg.com/sdk/latest.json).windows
        }
        Write-Host "Vulkan SDK $version"
        $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
        # -f: without it curl saves the server's "Not Found" body as the .exe
        # and the failure only surfaces later as "not a valid application".
        curl.exe -fsSL -o $installer `
          "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
        & $installer --accept-licenses --default-answer --confirm-command install | Out-Null
        $sdk = "C:\VulkanSDK\$version"
        if (-not (Test-Path "$sdk\Bin\glslc.exe")) {
          throw "Vulkan SDK installed but $sdk\Bin\glslc.exe is missing"
        }
        & "$sdk\Bin\glslc.exe" --version
        Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
        Add-Content $env:GITHUB_PATH "$sdk\Bin"
