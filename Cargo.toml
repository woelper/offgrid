[package]
name = "offgrid"
version = "0.8.0"
edition = "2024"
description = "Fully local LLM prepper tool: download, chat, code and serve — offline"
license = "MIT"

[package.metadata.bundle]
name = "offgrid"
identifier = "com.woelper.offgrid"
icon = ["assets/icons/Alert_Idea.png"]
category = "Developer Tool"
short_description = "Fully local LLM prepper tool"

[features]
# GPU offload through Vulkan — one backend for every vendor (NVIDIA, AMD,
# Intel), unlike CUDA or ROCm. Off by default: building it needs the Vulkan
# SDK (glslc compiles ggml's shaders, and on Windows VULKAN_SDK must be set),
# while a plain `cargo build` should keep working with nothing installed.
# A binary built with it still runs where there is no usable GPU — llama.cpp
# finds no Vulkan device and everything stays on the CPU.
vulkan = ["llama-cpp-2/vulkan"]
# GPU offload through CUDA — NVIDIA only, and the fastest backend on their
# cards. Off by default: building it needs the CUDA toolkit (nvcc plus the
# cublas/cudart dev libraries), while a plain `cargo build` should keep
# working with nothing installed. A binary built with it needs the NVIDIA
# driver installed; where there is no usable GPU it stays on the CPU.
cuda = ["llama-cpp-2/cuda"]
# Local image generation through stable-diffusion.cpp. It shares one ggml with
# llama.cpp rather than linking a second copy (see `shared-ggml`), which is why
# this needs scripts/images-build.sh rather than a bare `cargo build`: the ggml
# and the sd.cpp static library are produced outside cargo, and the script
# passes their location in OFFGRID_SD_PREFIX.
#
# The earlier candle implementation is in this branch's history. It was five
# times slower on a CPU (47s a step, 31s with MKL, against 9.2s here), has no
# Vulkan backend for non-NVIDIA cards, and could not use quantized weights.
images = ["shared-ggml", "dep:cc", "dep:png"]
# Experiment, and the foundation of `images`: link llama.cpp against a ggml
# built outside the crate, so a second consumer of ggml can link the same copy
# instead of bringing its own and colliding on every symbol. GGML_MAX_NAME must
# match across all of them — it is part of ggml_tensor's layout.
shared-ggml = ["llama-cpp-2/system-ggml", "llama-cpp-2/system-ggml-static"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
eframe = "0.35.0"
egui_commonmark = "0.24.0"
egui_extras = { version = "0.35", features = ["image", "syntect"] }
# jpeg and webp are here for reference images: a product photograph arrives as
# whatever the phone or the shop produced, and png alone would turn most of
# them away.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Saving a generated image writes the prompt and settings into the file as PNG
# text chunks, which the `image` crate has no way to express; png is already in
# the tree underneath it.
png = { version = "0.18.1", optional = true }
libc = "0.2"
llama-cpp-2 = "0.1.154"
open = "5.4.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
tiny_http = "0.12.0"
ureq = "3.4.0"
wait-timeout = "0.2.1"

[build-dependencies]
# Compiles src/sd/offgrid_sd.c, the C surface over stable-diffusion.h.
cc = { version = "1.2", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

[patch.crates-io]
# egui has no font weights (`strong()` only changes the colour) and
# egui_commonmark offers no hook for a bold face, so `**bold**` in markdown
# rendered in the regular weight. This is upstream 0.24.0 plus one change in
# src/misc.rs: strong text and headings use the font family named "bold" when
# the app has registered one (theme.rs binds it to the skin's Bold face).
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }

# Debug builds: light optimization for our code (fast incremental compiles),
# full optimization for dependencies — that's where the hot paths live
# (syntect, inference glue), and it makes the cmake-built llama.cpp compile
# as Release instead of Debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# min-sized-rust settings (https://github.com/johnthagen/min-sized-rust).
# Deliberate deviation: opt-level stays 3 instead of "z" — the cmake crate
# maps s/z to a MinSizeRel (-Os) build of llama.cpp, which slows inference.
# Note: `cargo test` must run without --release (panic = "abort" breaks the
# libtest harness).
[profile.release]
opt-level = 3
# lto = true
# codegen-units = 1
strip = true
panic = "abort"
